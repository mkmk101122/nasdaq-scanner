name: NASDAQ Open

on:
  schedule:
    # 16:10 ו-16:30 Asia/Jerusalem (winter, UTC+2) -> 14:10 / 14:30 UTC
    # הראשונה מגיעה 10 דקות לפני הפתיחה (סריקה ~16:10) · השנייה מתחילה ברגע
    # הפתיחה ומגיעה כאשר הסריקה מסתיימת (~16:40)
    - cron: "10,30 14 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nasdaq-cache-
          restore-keys: |
            nasdaq-cache-

      - name: Run opening scan
        run: python3 scanner.py --brief --universe 2000 --etf-limit 625 --top 20 --ttl 86400

      - name: Deliver
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 cloud/deliver.py --mode open
