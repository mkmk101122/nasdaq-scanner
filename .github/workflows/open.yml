name: NASDAQ Open

on:
  schedule:
    # 16:40 Asia/Jerusalem (winter, UTC+2) -> 14:40 UTC
    # סריקת הפתיחה — מגיעה כשהסורק מסתיים, כ-10 דקות אחרי פתיחת השוק.
    - cron: "40 14 * * 1-5"
  workflow_dispatch:

# שתי ריצות של אותה workflow (מתוזמנת + ידנית) לא יחלפו זו את זו.
concurrency:
  group: nasdaq-open
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nasdaq-cache-
          restore-keys: |
            nasdaq-cache-

      - name: Run opening scan
        run: python3 scanner.py --brief --universe 2000 --etf-limit 625 --top 20 --ttl 86400

      - name: Deliver
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 cloud/deliver.py --mode open
