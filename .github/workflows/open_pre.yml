name: NASDAQ Open Pre

on:
  schedule:
    # 15:45 Asia/Jerusalem (winter, UTC+2) -> 13:45 UTC
    # סריקה מוקדמת שמספקת תמונה לפני הפתיחה (45 דקות לפני).
    # מרוצה בנפרד מ-NASDAQ Open כדי שריצה אחת לא תדחוף את השנייה.
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

# שתי ריצות של אותה workflow (מתוזמנת + ידנית) לא יחלפו זו את זו.
concurrency:
  group: nasdaq-open-pre
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nasdaq-cache-
          restore-keys: |
            nasdaq-cache-

      - name: Run pre-open scan
        run: python3 scanner.py --brief --universe 2000 --etf-limit 625 --top 20 --ttl 86400

      - name: Deliver
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 cloud/deliver.py --mode open --title "⏰ <b>סריקה מוקדמת — לפני פתיחת השוק</b>"
