name: NASDAQ Daily Report

on:
  schedule:
    # 21:15 UTC = 23:15 Asia/Jerusalem (winter, UTC+2) — אחרי סגירת השוק.
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nasdaq-cache-
          restore-keys: |
            nasdaq-cache-

      # מדידת תוצאות: נשמר מכל ריצה (מפתח מתגלגל, restore-keys למציאת האחרון)
      - name: Restore tracking state
        uses: actions/cache@v4
        with:
          path: tracking
          key: nasdaq-tracking-${{ github.run_id }}
          restore-keys: |
            nasdaq-tracking-

      - name: Run full scan
        run: python3 scanner.py --universe 2000 --etf-limit 625 --top 15 --refresh

      - name: Record signals for tracking
        run: python3 tracker.py snapshot

      - name: Score recorded signals
        run: python3 tracker.py score --max-days 5 --summary-out tracking_block.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/
          retention-days: 30

      - name: Deliver
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 cloud/deliver.py --mode daily
